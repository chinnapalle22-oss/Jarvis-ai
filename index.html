<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: radial-gradient(circle, #102b49, #020711 75%);
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
  min-height: 100vh;
}

h1 {
  color: #00eaff;
  font-size: 38px;
  letter-spacing: 6px;
  text-shadow: 0 0 10px #00eaff, 0 0 30px #008cff;
}

p {
  color: #8bdfff;
  letter-spacing: 3px;
}

#status {
  color: #00ffcc;
  margin: 25px;
  padding: 12px;
  border: 1px solid #00eaff;
  border-radius: 20px;
  box-shadow: 0 0 15px #00aaff;
}

#answer {
  background: rgba(0, 35, 65, 0.8);
  border: 1px solid #00cfff;
  padding: 20px;
  border-radius: 15px;
  min-height: 120px;
  margin-top: 25px;
  text-align: left;
  overflow-wrap: anywhere;
  box-shadow: 0 0 20px #006aff;
  color: white;
}

input {
  width: 90%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #00eaff;
  background: #071a2e;
  color: white;
  font-size: 16px;
  margin-top: 20px;
}

button {
  background: #007bff;
  color: white;
  border: 1px solid #00eaff;
  padding: 15px 25px;
  margin: 10px;
  border-radius: 25px;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 0 15px #008cff;
}

button:active {
  transform: scale(0.95);
  background: #00cfff;
}

#mic {
  background: #007c91;
  box-shadow: 0 0 20px #00eaff;
}
  .reactor {
  width: 190px;
  height: 190px;
  margin: 35px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring {
  position: absolute;
  border: 2px solid #00eaff;
  border-radius: 50%;
  box-shadow: 0 0 15px #00eaff;
}

.ring1 {
  width: 190px;
  height: 190px;
  border-top-color: transparent;
  animation: rotate 4s linear infinite;
}

.ring2 {
  width: 155px;
  height: 155px;
  border-bottom-color: transparent;
  animation: rotate 3s linear infinite reverse;
}

.ring3 {
  width: 120px;
  height: 120px;
  animation: pulse 2s infinite;
}

.core {
  width: 75px;
  height: 75px;
  background: #00cfff;
  color: #00101c;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: bold;
  box-shadow: 0 0 25px #00eaff, 0 0 50px #008cff;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  50% { transform: scale(1.15); }
  }
  .reactor.active .core {
  box-shadow: 0 0 40px #00eaff,
              0 0 80px #008cff,
              0 0 120px #00eaff;
  transform: scale(1.2);
}

.reactor.active .ring {
  animation-duration: 1s;
}

.reactor.active {
  filter: brightness(1.8);
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S</h1>
  <div class="reactor">
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>
  <div class="core">J</div>
  </div>
<p>YOUR PERSONAL AI ASSISTANT</p>

<div id="status">SYSTEM ONLINE</div>

<input id="question"
placeholder="Ask me anything...">

<br>

<button onclick="askJarvis()">SEND</button>
<button id="mic" onclick="startVoice()">🎤 SPEAK</button>

<div id="answer">
  Hello! I am JARVIS. How can I help you?
</div>

<script>

// Add your Apps Script web app URL here later.
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw8lcdwSpSo_0X0Wmf40mQec3SQGP5m-JfNCbsJDliE2FDDEy88nW1el3WvivRabVPe/exec";

function speak(text) {
  if (!window.speechSynthesis) return;

  speechSynthesis.cancel();

  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speech.rate = 1;

  speechSynthesis.speak(speech);
}

async function askJarvis() {

  let q = document.getElementById("question").value.trim();

  if (!q) return;

  document.getElementById("status").innerText = "THINKING...";
  document.getElementById("answer").innerText = "JARVIS is processing...";

  if (BACKEND_URL.startsWith("PASTE")) {
    document.getElementById("answer").innerText =
      "AI connection will be configured in the next step.";
    document.getElementById("status").innerText = "WAITING FOR CONNECTION";
    return;
  }

  try {
    let response = await fetch(
      BACKEND_URL + "?q=" + encodeURIComponent(q)
    );

    let data = await response.json();

    let reply = data.reply || data.answer || "No response received.";

    document.getElementById("answer").innerText = reply;
    document.getElementById("status").innerText = "ONLINE";

    speak(reply);

  } catch (error) {
    document.getElementById("answer").innerText =
      "Connection error: " + error.message;

    document.getElementById("status").innerText = "ERROR";
  }
}

function startVoice() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Speech recognition is not supported.");
    return;
  }

  const recognition = new Recognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    document.getElementById("status").innerText = "LISTENING...";
  };

  recognition.onresult = function(event) {
    let text = event.results[0][0].transcript;

    document.getElementById("question").value = text;

    askJarvis();
  };

  recognition.onerror = function(event) {
    document.getElementById("status").innerText =
      "VOICE ERROR: " + event.error;
  };

  recognition.onend = function() {
    if (document.getElementById("status").innerText === "LISTENING...") {
      document.getElementById("status").innerText = "ONLINE";
    }
  };

  recognition.start();
}

</script>
<!-- JARVIS AI VIDEO STUDIO --><style>
#videoStudio {
  background: #090909;
  color: #fff;
  padding: 20px;
  margin: 20px 0;
  border: 1px solid #ff3030;
  border-radius: 15px;
  font-family: Arial, sans-serif;
}
#videoStudio h2 {
  color: #ff3030;
  text-align: center;
}
.jarvis-card {
  background: #181818;
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
}
.jarvis-card button {
  background: #c90000;
  color: white;
  border: none;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  width: 100%;
}
.jarvis-card input, .jarvis-card textarea {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  box-sizing: border-box;
  border-radius: 6px;
}
#videoPreview {
  width: 100%;
  margin-top: 12px;
  display: none;
}
</style><section id="videoStudio">
  <h2>🤖 JARVIS VIDEO STUDIO</h2>
  <p style="text-align:center;color:#aaa">
    AI VIDEO CREATION & EDITING CENTER
  </p>  <div class="jarvis-card">
    <h3>🎬 Upload Your Video</h3>
    <input type="file" id="jarvisVideo" accept="video/*">
    <video id="videoPreview" controls></video>
  </div>  <div class="jarvis-card">
    <h3>✂️ Video Trimmer</h3>
    <label>Start time (seconds)</label>
    <input type="number" id="startTime" value="0" min="0">
    <label>End time (seconds)</label>
    <input type="number" id="endTime" value="30" min="1">
    <button onclick="jarvisTrimPreview()">Preview Selected Section</button>
  </div>  <div class="jarvis-card">
    <h3>🎙️ AI Video Script</h3>
    <textarea id="videoPrompt" rows="4"
      placeholder="Describe the video you want JARVIS to create..."></textarea>
    <button onclick="jarvisGenerateScript()">Generate Video Script</button>
    <textarea id="generatedScript" rows="5"
      placeholder="Your generated script will appear here"></textarea>
  </div>  <div class="jarvis-card">
    <h3>📱 YouTube Video Details</h3>
    <input id="ytTitle" placeholder="YouTube video title">
    <textarea id="ytDescription" rows="3"
      placeholder="Video description"></textarea>
    <button onclick="jarvisPrepareUpload()">Prepare YouTube Upload</button>
    <p id="uploadStatus"></p>
  </div>
</section><script>
let jarvisVideoURL = null;

document.getElementById("jarvisVideo").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  if (jarvisVideoURL) URL.revokeObjectURL(jarvisVideoURL);
  jarvisVideoURL = URL.createObjectURL(file);

  const preview = document.getElementById("videoPreview");
  preview.src = jarvisVideoURL;
  preview.style.display = "block";
});

function jarvisTrimPreview() {
  const video = document.getElementById("videoPreview");
  const start = Number(document.getElementById("startTime").value);
  const end = Number(document.getElementById("endTime").value);

  if (!video.src || !video.duration) {
    alert("Upload a video first.");
    return;
  }

  if (start < 0 || end <= start || end > video.duration) {
    alert("Enter valid start and end times.");
    return;
  }

  video.currentTime = start;
  video.play();

  video.ontimeupdate = function() {
    if (video.currentTime >= end) {
      video.pause();
      video.ontimeupdate = null;
    }
  };
}

function jarvisGenerateScript() {
  const prompt = document.getElementById("videoPrompt").value.trim();

  if (!prompt) {
    alert("Enter a video idea first.");
    return;
  }

  document.getElementById("generatedScript").value =
    "VIDEO TITLE: " + prompt +
    "\n\nINTRODUCTION:\nWelcome to our channel!\n\n" +
    "MAIN CONTENT:\n" + prompt +
    "\n\nCONCLUSION:\nLike, Share and Subscribe!";
}

function jarvisPrepareUpload() {
  const title = document.getElementById("ytTitle").value.trim();
  const description = document.getElementById("ytDescription").value.trim();

  if (!title || !description) {
    alert("Enter a title and description.");
    return;
  }

  document.getElementById("uploadStatus").textContent =
    "Video details prepared. YouTube API connection is required for uploading.";
}
</script>
</body>
</html>
