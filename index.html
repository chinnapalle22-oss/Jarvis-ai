<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: radial-gradient(circle, #102b49, #020711 75%);
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
  min-height: 100vh;
}

h1 {
  color: #00eaff;
  font-size: 38px;
  letter-spacing: 6px;
  text-shadow: 0 0 10px #00eaff, 0 0 30px #008cff;
}

p {
  color: #8bdfff;
  letter-spacing: 3px;
}

#status {
  color: #00ffcc;
  margin: 25px;
  padding: 12px;
  border: 1px solid #00eaff;
  border-radius: 20px;
  box-shadow: 0 0 15px #00aaff;
}

#answer {
  background: rgba(0, 35, 65, 0.8);
  border: 1px solid #00cfff;
  padding: 20px;
  border-radius: 15px;
  min-height: 120px;
  margin-top: 25px;
  text-align: left;
  overflow-wrap: anywhere;
  box-shadow: 0 0 20px #006aff;
  color: white;
}

input {
  width: 90%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #00eaff;
  background: #071a2e;
  color: white;
  font-size: 16px;
  margin-top: 20px;
}

button {
  background: #007bff;
  color: white;
  border: 1px solid #00eaff;
  padding: 15px 25px;
  margin: 10px;
  border-radius: 25px;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 0 15px #008cff;
}

button:active {
  transform: scale(0.95);
  background: #00cfff;
}

#mic {
  background: #007c91;
  box-shadow: 0 0 20px #00eaff;
}
  .reactor {
  width: 190px;
  height: 190px;
  margin: 35px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring {
  position: absolute;
  border: 2px solid #00eaff;
  border-radius: 50%;
  box-shadow: 0 0 15px #00eaff;
}

.ring1 {
  width: 190px;
  height: 190px;
  border-top-color: transparent;
  animation: rotate 4s linear infinite;
}

.ring2 {
  width: 155px;
  height: 155px;
  border-bottom-color: transparent;
  animation: rotate 3s linear infinite reverse;
}

.ring3 {
  width: 120px;
  height: 120px;
  animation: pulse 2s infinite;
}

.core {
  width: 75px;
  height: 75px;
  background: #00cfff;
  color: #00101c;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: bold;
  box-shadow: 0 0 25px #00eaff, 0 0 50px #008cff;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  50% { transform: scale(1.15); }
  }
</style>
</head>

<body>

<h1>J.A.R.V.I.S</h1>
  <div class="reactor">
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>
  <div class="core">J</div>
  </div>
<p>YOUR PERSONAL AI ASSISTANT</p>

<div id="status">SYSTEM ONLINE</div>

<input id="question"
placeholder="Ask me anything...">

<br>

<button onclick="askJarvis()">SEND</button>
<button id="mic" onclick="startVoice()">🎤 SPEAK</button>

<div id="answer">
  Hello! I am JARVIS. How can I help you?
</div>

<script>

// Add your Apps Script web app URL here later.
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw8lcdwSpSo_0X0Wmf40mQec3SQGP5m-JfNCbsJDliE2FDDEy88nW1el3WvivRabVPe/exec";

function speak(text) {
  if (!window.speechSynthesis) return;

  speechSynthesis.cancel();

  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speech.rate = 1;

  speechSynthesis.speak(speech);
}

async function askJarvis() {

  let q = document.getElementById("question").value.trim();

  if (!q) return;

  document.getElementById("status").innerText = "THINKING...";
  document.getElementById("answer").innerText = "JARVIS is processing...";

  if (BACKEND_URL.startsWith("PASTE")) {
    document.getElementById("answer").innerText =
      "AI connection will be configured in the next step.";
    document.getElementById("status").innerText = "WAITING FOR CONNECTION";
    return;
  }

  try {
    let response = await fetch(
      BACKEND_URL + "?q=" + encodeURIComponent(q)
    );

    let data = await response.json();

    let reply = data.reply || data.answer || "No response received.";

    document.getElementById("answer").innerText = reply;
    document.getElementById("status").innerText = "ONLINE";

    speak(reply);

  } catch (error) {
    document.getElementById("answer").innerText =
      "Connection error: " + error.message;

    document.getElementById("status").innerText = "ERROR";
  }
}

function startVoice() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Speech recognition is not supported.");
    return;
  }

  const recognition = new Recognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    document.getElementById("status").innerText = "LISTENING...";
  };

  recognition.onresult = function(event) {
    let text = event.results[0][0].transcript;

    document.getElementById("question").value = text;

    askJarvis();
  };

  recognition.onerror = function(event) {
    document.getElementById("status").innerText =
      "VOICE ERROR: " + event.error;
  };

  recognition.onend = function() {
    if (document.getElementById("status").innerText === "LISTENING...") {
      document.getElementById("status").innerText = "ONLINE";
    }
  };

  recognition.start();
}

</script>

</body>
</html>
